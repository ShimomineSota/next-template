name: CI

# PR gate. Pushes to main / develop are verified by CD (cd.yml) instead, so the
# checks never run twice for the same commit.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    secrets: inherit
