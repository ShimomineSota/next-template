name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Skip the Vite+ git-hook dispatcher install that `npm ci` triggers via `prepare`.
      VP_GIT_HOOKS: "0"
      # The two build steps decrypt `.env.production` / `.env.staging`; once
      # those hold real (encrypted) values these secrets must be set. While
      # they're the template's plaintext placeholders, dotenvx reads them
      # without a key and the secrets can stay empty. check/test skip env
      # validation entirely. Fork PRs get no secrets, so their builds fail.
      DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
      DOTENV_PRIVATE_KEY_STAGING: ${{ secrets.DOTENV_PRIVATE_KEY_STAGING }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # `prepare` runs `panda codegen`, generating the gitignored styled-system/ dir.
      - run: npm ci

      - name: Format + lint + typecheck
        run: npm run check

      - name: Test
        run: npm run test

      - name: Build (production)
        run: npm run build

      - name: Build (staging)
        run: npm run build:staging

  deploy-staging:
    # develop -> Cloudflare Worker "next-template-staging" (wrangler env.staging).
    # Set repo variable ENABLE_DEPLOY=true once CF secrets + KV ids are in place.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.ENABLE_DEPLOY == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      VP_GIT_HOOKS: "0"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DOTENV_PRIVATE_KEY_STAGING: ${{ secrets.DOTENV_PRIVATE_KEY_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Build + deploy (staging)
        run: npm run deploy:staging
      - name: Sync Worker secrets (staging)
        run: npm run cf:secrets:staging

  deploy-production:
    # main -> Cloudflare Worker "next-template" (wrangler top-level config).
    # Set repo variable ENABLE_DEPLOY=true once CF secrets + KV ids are in place.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VP_GIT_HOOKS: "0"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Build + deploy (production)
        run: npm run deploy
      - name: Sync Worker secrets (production)
        run: npm run cf:secrets
